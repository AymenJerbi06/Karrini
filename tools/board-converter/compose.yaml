services:
  converter:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      BOARD_CONVERTER_SECRET: ${BOARD_CONVERTER_SECRET:?Set a random secret of at least 32 characters}
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    mem_limit: 768m
    cpus: 1
    pids_limit: 64
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    networks: [conversion]
    restart: unless-stopped
networks:
  conversion:
    internal: true
